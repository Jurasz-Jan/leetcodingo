name: Release

# Wydanie powstaje z tagu: `git tag v0.2 && git push origin v0.2`.
# Cały proces idzie przez CI, więc klucz podpisujący nie musi być na żadnej
# maszynie roboczej, a APK w wydaniu jest odtwarzalne z commita.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Zbuduj i opublikuj
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: pip install pytest

      - name: Testy pipeline'u
        run: python -m pytest generator/tests -q

      - name: Korpus zgadza się z generatorem
        run: |
          python generator/build.py
          if ! git diff --exit-code -- corpus/; then
            echo '::error::corpus/ nie zgadza sie z wynikiem generatora, wydanie wstrzymane.'
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Odtwórz keystore z sekretu
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::brak sekretu KEYSTORE_BASE64. Wydanie zostałoby podpisane kluczem debugowym, a takiego APK nie da się później zaktualizować na wierzch.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Zbuduj podpisane APK
        working-directory: app
        env:
          LEETCODINGO_KEYSTORE: ${{ runner.temp }}/release.jks
          LEETCODINGO_STORE_PASSWORD: ${{ secrets.LEETCODINGO_STORE_PASSWORD }}
          LEETCODINGO_KEY_ALIAS: ${{ secrets.LEETCODINGO_KEY_ALIAS }}
          LEETCODINGO_KEY_PASSWORD: ${{ secrets.LEETCODINGO_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode musi rosnąć, inaczej Android nie uzna nowego APK za aktualizację.
          # Numer przebiegu workflow jest monotoniczny i wystarcza.
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Sprawdź, czym APK jest podpisane
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/app/build/outputs/apk/release/app-release.apk

      - name: Nazwij plik wersją
        run: |
          mv app/app/build/outputs/apk/release/app-release.apk \
             "leetcodingo-${GITHUB_REF_NAME}.apk"

      - name: Opublikuj wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "leetcodingo-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
